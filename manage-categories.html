<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories - SRKR Canteen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #fafafa; }
        .card-shadow { box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); }
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="text-gray-800 min-h-screen relative">
    
    <nav class="border-b border-gray-200 px-6 py-4 flex justify-between items-center z-10 relative bg-white shadow-sm">
        <span class="text-xl font-bold tracking-tight text-gray-900">SRKR Canteen</span>
        <button id="logout-btn" class="text-sm font-semibold text-red-600 hover:text-red-800 transition-colors">Logout</button>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8">
        
        <div class="flex justify-between items-center mb-8 border-b border-gray-200 pb-4">
            <h2 class="text-2xl font-bold text-gray-900">Manage Categories</h2>
            
            <button id="open-modal-btn" class="bg-gray-900 hover:bg-black text-white font-medium py-2.5 px-5 rounded-lg shadow-sm transition-colors flex items-center space-x-2">
                <span>Add Category</span>
            </button>
        </div>
        
        <div id="categories-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            </div>
    </main>

    <div id="category-modal" class="hidden fixed inset-0 z-50 overflow-y-auto">
        <div class="fixed inset-0 bg-black bg-opacity-40 backdrop-blur-sm transition-opacity" id="modal-overlay"></div>
        
        <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
            <div class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-lg">
                <div class="bg-white px-6 pb-4 pt-6">
                    <h3 class="text-xl font-bold leading-6 text-gray-900 mb-6">Add New Category</h3>
                    
                    <form id="add-category-form" class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium mb-1 text-gray-700">Category Name</label>
                            <input type="text" id="cat-name" required class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:border-gray-900 focus:ring-1 focus:ring-gray-900" placeholder="e.g. Biryani, Tiffins, Drinks">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1 text-gray-700">Image URL</label>
                            <input type="url" id="cat-image" required class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:border-gray-900 focus:ring-1 focus:ring-gray-900" placeholder="https://image-link.com/...">
                        </div>
                    </form>
                </div>
                
                <div class="bg-gray-50 px-6 py-4 flex flex-row-reverse border-t border-gray-100 gap-3">
                    <button type="submit" form="add-category-form" class="inline-flex justify-center rounded-xl bg-gray-900 px-5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-black transition-colors">Save Category</button>
                    <button type="button" id="close-modal-btn" class="inline-flex justify-center rounded-xl bg-white px-5 py-2.5 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 transition-colors">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, deleteDoc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 1. Setup Firebase Connection
        const firebaseConfig = {
            apiKey: "AIzaSyAzj2KBA8wBb1rOhA80FnZzXkMKCTlp_Es",
            authDomain: "srkr-canteen.firebaseapp.com",
            projectId: "srkr-canteen",
            storageBucket: "srkr-canteen.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 2. Popup Modal Controls
        const modal = document.getElementById('category-modal');
        document.getElementById('open-modal-btn').addEventListener('click', () => modal.classList.remove('hidden'));
        
        const closeModal = () => {
            modal.classList.add('hidden');
            document.getElementById('add-category-form').reset(); // Clear form when closed
        };
        
        document.getElementById('close-modal-btn').addEventListener('click', closeModal);
        document.getElementById('modal-overlay').addEventListener('click', closeModal);

        // 3. Logout Handling
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = 'index.html');
        });

        // 4. Save Category from Popup to Database
        document.getElementById('add-category-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.innerText = "Saving...";
            submitBtn.disabled = true;

            try {
                await addDoc(collection(db, "categories"), {
                    name: document.getElementById('cat-name').value,
                    image: document.getElementById('cat-image').value,
                    active: true // Default status is ON
                });
                closeModal(); // Close popup immediately after saving
            } catch (err) {
                console.error("Error saving: ", err);
                alert("Failed to save category.");
            } finally {
                submitBtn.innerText = "Save Category";
                submitBtn.disabled = false;
            }
        });

        // 5. Fetch and Display Saved Categories in Card Format
        onSnapshot(collection(db, "categories"), (snapshot) => {
            const container = document.getElementById('categories-container');
            container.innerHTML = '';
            
            if (snapshot.empty) {
                container.innerHTML = `<p class="text-gray-500 col-span-full text-center py-10">No categories found. Click "Add Category" to create one.</p>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                
                // Determine if the toggle should be checked (ON)
                const isChecked = data.active !== false ? 'checked' : '';
                
                // Build the Card HTML
                container.innerHTML += `
                    <div class="bg-white border border-gray-100 rounded-2xl overflow-hidden flex flex-col card-shadow hover:-translate-y-1 transition-transform duration-300">
                        <img src="${data.image}" alt="${data.name}" class="w-full h-44 object-cover bg-gray-50 border-b border-gray-50">
                        
                        <div class="p-5 flex flex-col flex-1">
                            <h3 class="font-bold text-xl mb-4 text-gray-900 tracking-tight">${data.name}</h3>
                            
                            <div class="flex items-center justify-between mb-5 mt-auto bg-gray-50 p-3 rounded-lg">
                                <span class="text-sm font-semibold text-gray-600">Available (On/Off)</span>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" ${isChecked} onchange="window.toggleStatus('${id}', this.checked)" class="sr-only peer">
                                    <div class="w-10 h-5 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-green-500"></div>
                                </label>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-3">
                                <a href="manage-products.html?categoryId=${id}&categoryName=${encodeURIComponent(data.name)}" class="bg-gray-900 text-white text-center py-2.5 rounded-xl text-sm font-semibold hover:bg-black transition-colors">Manage</a>
                                <button onclick="window.deleteItem('${id}')" class="bg-white border border-red-200 text-red-600 py-2.5 rounded-xl text-sm font-semibold hover:bg-red-50 transition-colors">Delete</button>
                            </div>
                        </div>
                    </div>`;
            });
        });

        // 6. Global Functions to handle Toggle and Delete clicks
        window.toggleStatus = async (id, status) => {
            await updateDoc(doc(db, "categories", id), { active: status });
        };

        window.deleteItem = async (id) => {
            if(confirm("Are you sure you want to delete this category?")) {
                await deleteDoc(doc(db, "categories", id));
            }
        };
    </script>
</body>
</html>
