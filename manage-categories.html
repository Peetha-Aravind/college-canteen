
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories - SRKR Canteen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: system-ui, sans-serif; background-color: #ffffff; }</style>
</head>
<body class="text-gray-800 min-h-screen relative">
    
    <nav class="border-b border-gray-200 px-6 py-4 flex justify-between items-center z-10 relative bg-white">
        <span class="text-xl font-bold tracking-tight text-gray-900">SRKR Canteen</span>
        <button id="logout-btn" class="text-sm font-semibold text-red-600 hover:text-red-800 transition-colors">Logout</button>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8">
        <div class="flex justify-between items-center mb-8 border-b border-gray-100 pb-4">
            <h2 class="text-2xl font-bold text-gray-900">Manage Categories</h2>
            <button id="open-modal-btn" class="bg-gray-900 hover:bg-black text-white font-medium py-2.5 px-5 rounded-lg shadow-sm transition-colors flex items-center space-x-2">
                <span>Add Category</span>
            </button>
        </div>
        
        <div id="categories-container" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
            </div>
    </main>

    <div id="category-modal" class="hidden fixed inset-0 z-50 overflow-y-auto">
        <div class="fixed inset-0 bg-black bg-opacity-50 transition-opacity" id="modal-overlay"></div>

        <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
            <div class="relative transform overflow-hidden rounded-xl bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg">
                <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
                    <h3 class="text-lg font-bold leading-6 text-gray-900 mb-4" id="modal-title">Add New Category</h3>
                    
                    <form id="add-category-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1 text-gray-700">Category Name</label>
                            <input type="text" id="cat-name" required class="w-full p-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-gray-900 focus:ring-1 focus:ring-gray-900" placeholder="e.g. Tiffins">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1 text-gray-700">Image URL</label>
                            <input type="url" id="cat-image" required class="w-full p-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-gray-900 focus:ring-1 focus:ring-gray-900" placeholder="https://...">
                        </div>
                    </form>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6 border-t border-gray-200">
                    <button type="submit" form="add-category-form" class="inline-flex w-full justify-center rounded-lg bg-gray-900 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-black sm:ml-3 sm:w-auto transition-colors">
                        Save Category
                    </button>
                    <button type="button" id="close-modal-btn" class="mt-3 inline-flex w-full justify-center rounded-lg bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto transition-colors">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, deleteDoc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 1. Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAzj2KBA8wBb1rOhA80FnZzXkMKCTlp_Es",
            authDomain: "srkr-canteen.firebaseapp.com",
            projectId: "srkr-canteen",
            storageBucket: "srkr-canteen.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 2. Modal Logic
        const modal = document.getElementById('category-modal');
        const openModalBtn = document.getElementById('open-modal-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const modalOverlay = document.getElementById('modal-overlay');
        const addCategoryForm = document.getElementById('add-category-form');

        const openModal = () => modal.classList.remove('hidden');
        
        const closeModal = () => {
            modal.classList.add('hidden');
            addCategoryForm.reset(); // Clear form when closed
        };

        openModalBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', closeModal);

        // 3. Logout Handling
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = 'index.html');
        });

        // 4. Add Category Submit Handler
        addCategoryForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerText = "Saving...";

            try {
                await addDoc(collection(db, "categories"), {
                    name: document.getElementById('cat-name').value,
                    image: document.getElementById('cat-image').value,
                    active: true
                });
                closeModal();
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Failed to add category.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Save Category";
            }
        });

        // 5. Fetch and Render Categories
        onSnapshot(collection(db, "categories"), (snapshot) => {
            const container = document.getElementById('categories-container');
            container.innerHTML = '';
            
            if (snapshot.empty) {
                container.innerHTML = '<p class="text-gray-500 col-span-full text-center py-10">No categories found. Click "Add Category" to create one.</p>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                const isChecked = data.active !== false ? 'checked' : '';
                
                container.innerHTML += `
                    <div class="border border-gray-200 rounded-xl overflow-hidden flex flex-col shadow-sm hover:shadow-md transition-shadow">
                        <img src="${data.image}" alt="${data.name}" class="w-full h-40 object-cover bg-gray-100 border-b border-gray-100">
                        <div class="p-4 flex flex-col flex-1">
                            <h3 class="font-bold text-lg mb-4 text-gray-900">${data.name}</h3>
                            
                            <div class="flex items-center justify-between mb-4 mt-auto">
                                <span class="text-sm font-medium text-gray-500">Visible on Menu</span>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" ${isChecked} onchange="window.toggleStatus('${id}', this.checked)" class="sr-only peer">
                                    <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-green-500"></div>
                                </label>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-2 border-t border-gray-100 pt-3">
                                <a href="manage-products.html?categoryId=${id}&categoryName=${encodeURIComponent(data.name)}" class="bg-gray-50 text-center py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 border border-gray-200 transition-colors">Manage</a>
                                <button onclick="window.deleteItem('${id}')" class="bg-white border border-red-200 text-red-600 py-2 rounded-lg text-sm font-medium hover:bg-red-50 transition-colors">Delete</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        });

        // 6. Global Window Functions for Inline HTML handlers
        window.toggleStatus = async (id, status) => {
            try {
                await updateDoc(doc(db, "categories", id), { active: status });
            } catch (error) {
                console.error("Error updating status:", error);
            }
        };

        window.deleteItem = async (id) => {
            if(confirm("Are you sure you want to delete this category?")) {
                try {
                    await deleteDoc(doc(db, "categories", id));
                } catch (error) {
                    console.error("Error deleting category:", error);
                }
            }
        };
    </script>
</body>
</html>
