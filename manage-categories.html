<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories - SRKR Canteen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: system-ui, sans-serif; background-color: #ffffff; }</style>
</head>
<body class="text-gray-800 min-h-screen">
    
    <nav class="border-b border-gray-200 px-6 py-4 flex justify-between items-center">
        <span class="text-xl font-bold tracking-tight text-gray-900">SRKR Canteen</span>
        <button id="logout-btn" class="text-sm font-semibold text-red-600 hover:text-red-800">Logout</button>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8">
        <div class="mb-10 p-6 border border-gray-200 rounded-xl bg-gray-50">
            <h2 class="text-lg font-bold text-gray-900 mb-4">Add New Category</h2>
            <form id="add-category-form" class="flex flex-col md:flex-row gap-4 items-end">
                <div class="flex-1 w-full">
                    <label class="block text-sm font-medium mb-1 text-gray-700">Category Name</label>
                    <input type="text" id="cat-name" required class="w-full p-2.5 border border-gray-300 rounded-lg">
                </div>
                <div class="flex-1 w-full">
                    <label class="block text-sm font-medium mb-1 text-gray-700">Image URL</label>
                    <input type="url" id="cat-image" required class="w-full p-2.5 border border-gray-300 rounded-lg">
                </div>
                <button type="submit" class="bg-gray-900 hover:bg-black text-white font-medium py-2.5 px-6 rounded-lg w-full md:w-auto">
                    Add Category
                </button>
            </form>
        </div>

        <h2 class="text-2xl font-bold text-gray-900 mb-6">Current Categories</h2>
        <div id="categories-container" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, deleteDoc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzj2KBA8wBb1rOhA80FnZzXkMKCTlp_Es",
            authDomain: "srkr-canteen.firebaseapp.com",
            projectId: "srkr-canteen",
            storageBucket: "srkr-canteen.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = 'index.html');
        });

        document.getElementById('add-category-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "categories"), {
                name: document.getElementById('cat-name').value,
                image: document.getElementById('cat-image').value,
                active: true
            });
            e.target.reset();
        });

        onSnapshot(collection(db, "categories"), (snapshot) => {
            const container = document.getElementById('categories-container');
            container.innerHTML = '';
            
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                const isChecked = data.active !== false ? 'checked' : '';
                
                container.innerHTML += `
                    <div class="border border-gray-200 rounded-xl overflow-hidden flex flex-col">
                        <img src="${data.image}" alt="${data.name}" class="w-full h-40 object-cover bg-gray-100">
                        <div class="p-4 flex flex-col flex-1">
                            <h3 class="font-bold text-lg mb-4 text-gray-900">${data.name}</h3>
                            <div class="flex items-center justify-between mb-4">
                                <span class="text-sm font-medium text-gray-500">Status</span>
                                <input type="checkbox" ${isChecked} onchange="window.toggleStatus('${id}', this.checked)">
                            </div>
                            <div class="grid grid-cols-2 gap-2 mt-auto">
                                <a href="manage-products.html?categoryId=${id}&categoryName=${encodeURIComponent(data.name)}" class="bg-gray-100 text-center py-2 rounded-lg text-sm font-medium text-gray-800 hover:bg-gray-200">Manage</a>
                                <button onclick="window.deleteItem('${id}')" class="border border-red-200 text-red-600 py-2 rounded-lg text-sm font-medium hover:bg-red-50">Delete</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        });

        window.toggleStatus = async (id, status) => updateDoc(doc(db, "categories", id), { active: status });
        window.deleteItem = async (id) => confirm("Delete this category?") && deleteDoc(doc(db, "categories", id));
    </script>
</body>
</html>
