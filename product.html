<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - SRKR Canteen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #fafafa; }
        .glass-card { background: #ffffff; box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05); border: 1px solid #f0f0f0; }
    </style>
</head>
<body class="text-gray-800 min-h-screen">
    
    <nav class="border-b border-gray-200 px-6 py-4 flex justify-between items-center bg-white shadow-sm">
        <button onclick="window.history.back()" class="text-sm font-bold text-gray-500 hover:text-gray-900 transition-colors">← Back</button>
        <span class="text-xl font-bold tracking-tight text-gray-900">SRKR Canteen</span>
    </nav>

    <main class="max-w-2xl mx-auto py-12 px-6">
        <h2 id="form-title" class="text-3xl font-extrabold text-gray-900 mb-8 tracking-tight">Add Product Details</h2>
        
        <form id="product-form" class="space-y-6 glass-card p-8 rounded-2xl">
            <div>
                <label class="block text-sm font-semibold mb-2 text-gray-700">Product Name</label>
                <input type="text" id="prod-name" required class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:border-gray-900 focus:ring-1 focus:ring-gray-900 transition-all bg-gray-50 focus:bg-white">
            </div>
            
            <div>
                <label class="block text-sm font-semibold mb-2 text-gray-700">Description</label>
                <textarea id="prod-desc" required rows="3" class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:border-gray-900 focus:ring-1 focus:ring-gray-900 transition-all bg-gray-50 focus:bg-white"></textarea>
            </div>
            
            <div>
                <label class="block text-sm font-semibold mb-2 text-gray-700">Image URL</label>
                <input type="url" id="prod-image" required class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:border-gray-900 focus:ring-1 focus:ring-gray-900 transition-all bg-gray-50 focus:bg-white">
            </div>
            
            <div>
                <label class="block text-sm font-semibold mb-2 text-gray-700">Product Types / Variations</label>
                <input type="text" id="prod-types" required placeholder="e.g. Single, Full, Spicy" class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:border-gray-900 focus:ring-1 focus:ring-gray-900 transition-all bg-gray-50 focus:bg-white">
                <p class="text-xs text-gray-500 mt-2 font-medium">Separate variations with commas.</p>
            </div>
            
            <hr class="border-gray-100 my-6">
            
            <button type="submit" id="submit-btn" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-3.5 rounded-xl transition-all shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
                Save Product
            </button>
        </form>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzj2KBA8wBb1rOhA80FnZzXkMKCTlp_Es",
            authDomain: "srkr-canteen.firebaseapp.com",
            projectId: "srkr-canteen",
            storageBucket: "srkr-canteen.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const categoryId = urlParams.get('categoryId');
        const productId = urlParams.get('productId');

        if (productId) {
            document.getElementById('form-title').innerText = "Edit Product Details";
            document.getElementById('submit-btn').innerText = "Update Product";
            
            getDoc(doc(db, "products", productId)).then(docSnap => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('prod-name').value = data.name || '';
                    document.getElementById('prod-desc').value = data.description || '';
                    document.getElementById('prod-image').value = data.image || '';
                    document.getElementById('prod-types').value = data.types || '';
                }
            });
        }

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "Saving...";
            btn.disabled = true;
            
            const payload = {
                name: document.getElementById('prod-name').value,
                description: document.getElementById('prod-desc').value,
                image: document.getElementById('prod-image').value,
                types: document.getElementById('prod-types').value,
                categoryId: categoryId,
                active: true
            };

            try {
                if (productId) await updateDoc(doc(db, "products", productId), payload);
                else await addDoc(collection(db, "products"), payload);
                window.history.back(); 
            } catch (error) {
                console.error(error);
                alert("Failed to save product.");
                btn.innerText = "Save Product";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
