<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - SRKR Canteen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #f97316; --accent-dark: #ea580c; --bg: #f8fafc; --surface: #ffffff;
            --text: #0f172a; --text-light: #64748b; --border: #e2e8f0;
            --shadow-card: 0 10px 30px -10px rgba(0,0,0,0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; }
        
        nav { background: var(--surface); padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .back-link { background: none; border: none; font-size: 1rem; cursor: pointer; font-weight: 600; color: var(--text-light); transition: 0.2s; }
        .back-link:hover { color: var(--text); }
        nav h1 { font-size: 1.25rem; font-weight: 700; color: var(--accent-dark); }

        .container { max-width: 600px; margin: 3rem auto; padding: 0 1.5rem; }
        .form-header { margin-bottom: 2rem; text-align: center; }
        .form-header h2 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }

        .card { background: var(--surface); border-radius: 20px; padding: 2.5rem; box-shadow: var(--shadow-card); border: 1px solid var(--border); }
        
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text); }
        .input-group input, .input-group textarea {
            width: 100%; padding: 0.85rem 1rem; border: 1.5px solid var(--border); border-radius: 10px;
            font-size: 0.95rem; background: var(--bg); transition: all 0.25s; resize: vertical;
        }
        .input-group input:focus, .input-group textarea:focus {
            outline: none; border-color: var(--accent); background: var(--surface);
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.1);
        }
        .input-help { display: block; font-size: 0.75rem; color: var(--text-light); margin-top: 0.4rem; }

        .btn-submit {
            width: 100%; padding: 1rem; font-size: 1rem; font-weight: 600; color: white;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            border: none; border-radius: 10px; cursor: pointer; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.25); margin-top: 1rem;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(249, 115, 22, 0.35); }
    </style>
</head>
<body>

<nav>
    <button onclick="window.history.back()" class="back-link">← Back</button>
    <h1>SRKR Canteen</h1>
</nav>

<div class="container">
    <div class="form-header">
        <h2 id="form-title">Add Product</h2>
    </div>
    <div class="card">
        <form id="product-form">
            <div class="input-group">
                <label>Product Name</label>
                <input type="text" id="prod-name" required placeholder="e.g. Masala Dosa">
            </div>
            <div class="input-group">
                <label>Description</label>
                <textarea id="prod-desc" required rows="3" placeholder="Brief description of the item..."></textarea>
            </div>
            <div class="input-group">
                <label>Image URL</label>
                <input type="url" id="prod-image" required placeholder="https://...">
            </div>
            <div class="input-group">
                <label>Types / Variations</label>
                <input type="text" id="prod-types" required placeholder="e.g. Single, Full, Spicy">
                <span class="input-help">Separate variations with commas</span>
            </div>
            <button type="submit" id="submit-btn" class="btn-submit">Save Product</button>
        </form>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const app = initializeApp({
        apiKey: "AIzaSyAzj2KBA8wBb1rOhA80FnZzXkMKCTlp_Es",
        authDomain: "srkr-canteen.firebaseapp.com",
        projectId: "srkr-canteen",
        storageBucket: "srkr-canteen.firebasestorage.app"
    });
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const categoryId = urlParams.get('categoryId');
    const productId = urlParams.get('productId');

    if (productId) {
        document.getElementById('form-title').innerText = "Edit Product";
        document.getElementById('submit-btn').innerText = "Update Details";
        getDoc(doc(db, "products", productId)).then(docSnap => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('prod-name').value = data.name || '';
                document.getElementById('prod-desc').value = data.description || '';
                document.getElementById('prod-image').value = data.image || '';
                document.getElementById('prod-types').value = data.types || '';
            }
        });
    }

    document.getElementById('product-form').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        btn.innerText = "Saving..."; btn.disabled = true;
        
        const payload = {
            name: document.getElementById('prod-name').value,
            description: document.getElementById('prod-desc').value,
            image: document.getElementById('prod-image').value,
            types: document.getElementById('prod-types').value,
            categoryId: categoryId,
            active: true
        };

        try {
            if (productId) await updateDoc(doc(db, "products", productId), payload);
            else await addDoc(collection(db, "products"), payload);
            window.history.back(); 
        } catch(err) { alert("Error saving"); btn.innerText = "Save Product"; btn.disabled = false; }
    };
</script>
</body>
</html>
