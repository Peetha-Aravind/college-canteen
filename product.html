<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - SRKR Canteen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: system-ui, sans-serif; background-color: #ffffff; }</style>
</head>
<body class="text-gray-800 min-h-screen">
    
    <nav class="border-b border-gray-200 px-6 py-4 flex justify-between items-center bg-gray-50">
        <button onclick="window.history.back()" class="text-sm font-bold text-gray-500 hover:text-gray-900">Back</button>
        <span class="text-xl font-bold tracking-tight text-gray-900">SRKR Canteen</span>
    </nav>

    <main class="max-w-2xl mx-auto py-12 px-6">
        <h2 id="form-title" class="text-2xl font-bold text-gray-900 mb-6">Product Details</h2>
        
        <form id="product-form" class="space-y-5 border border-gray-200 p-6 rounded-xl shadow-sm">
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-700">Product Name</label>
                <input type="text" id="prod-name" required class="w-full p-2.5 border border-gray-300 rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-700">Description</label>
                <textarea id="prod-desc" required rows="3" class="w-full p-2.5 border border-gray-300 rounded-lg"></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-700">Image URL</label>
                <input type="url" id="prod-image" required class="w-full p-2.5 border border-gray-300 rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-700">Product Types (comma separated)</label>
                <input type="text" id="prod-types" required class="w-full p-2.5 border border-gray-300 rounded-lg">
            </div>
            <button type="submit" class="w-full bg-gray-900 hover:bg-black text-white font-medium py-3 rounded-lg">
                Save Product
            </button>
        </form>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzj2KBA8wBb1rOhA80FnZzXkMKCTlp_Es",
            authDomain: "srkr-canteen.firebaseapp.com",
            projectId: "srkr-canteen",
            storageBucket: "srkr-canteen.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const categoryId = urlParams.get('categoryId');
        const productId = urlParams.get('productId');

        if (productId) {
            document.getElementById('form-title').innerText = "Edit Product";
            getDoc(doc(db, "products", productId)).then(docSnap => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('prod-name').value = data.name || '';
                    document.getElementById('prod-desc').value = data.description || '';
                    document.getElementById('prod-image').value = data.image || '';
                    document.getElementById('prod-types').value = data.types || '';
                }
            });
        }

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('prod-name').value,
                description: document.getElementById('prod-desc').value,
                image: document.getElementById('prod-image').value,
                types: document.getElementById('prod-types').value,
                categoryId: categoryId,
                active: true
            };

            if (productId) await updateDoc(doc(db, "products", productId), payload);
            else await addDoc(collection(db, "products"), payload);
            
            window.history.back(); 
        });
    </script>
</body>
</html>
