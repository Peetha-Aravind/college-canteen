<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - SRKR Canteen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: system-ui, sans-serif; background-color: #ffffff; }</style>
</head>
<body class="text-gray-800 min-h-screen">
    
    <nav class="border-b border-gray-200 px-6 py-4 flex justify-between items-center bg-gray-50">
        <a href="manage-categories.html" class="text-sm font-bold text-gray-500 hover:text-gray-900">Back to Categories</a>
        <span class="text-xl font-bold tracking-tight text-gray-900">SRKR Canteen</span>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8">
        <div class="flex justify-between items-center mb-6">
            <h2 id="page-title" class="text-2xl font-bold text-gray-900">Products</h2>
            <a id="add-product-btn" href="#" class="bg-gray-900 hover:bg-black text-white font-medium py-2.5 px-5 rounded-lg">Add Product</a>
        </div>
        <hr class="border-gray-200 mb-6">
        
        <div id="products-container" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzj2KBA8wBb1rOhA80FnZzXkMKCTlp_Es",
            authDomain: "srkr-canteen.firebaseapp.com",
            projectId: "srkr-canteen",
            storageBucket: "srkr-canteen.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const categoryId = urlParams.get('categoryId');
        const categoryName = urlParams.get('categoryName');

        document.getElementById('page-title').innerText = `${categoryName || 'Category'} Products`;
        document.getElementById('add-product-btn').href = `product.html?categoryId=${categoryId}`;

        const q = query(collection(db, "products"), where("categoryId", "==", categoryId));

        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                const isChecked = data.active !== false ? 'checked' : '';
                
                container.innerHTML += `
                    <div class="border border-gray-200 rounded-xl overflow-hidden flex flex-col">
                        <img src="${data.image}" class="w-full h-40 object-cover bg-gray-100">
                        <div class="p-4 flex flex-col flex-1">
                            <h3 class="font-bold text-gray-900 mb-1">${data.name}</h3>
                            <p class="text-sm text-gray-500 mb-4 line-clamp-2">${data.description}</p>
                            <div class="flex items-center justify-between mb-4 mt-auto">
                                <span class="text-sm font-medium text-gray-500">Status</span>
                                <input type="checkbox" ${isChecked} onchange="window.toggleProdStatus('${id}', this.checked)">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <a href="product.html?categoryId=${categoryId}&productId=${id}" class="bg-gray-100 text-center py-2 rounded-lg text-sm font-medium text-gray-800 hover:bg-gray-200">Edit</a>
                                <button onclick="window.deleteProd('${id}')" class="border border-red-200 text-red-600 py-2 rounded-lg text-sm font-medium hover:bg-red-50">Delete</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        });

        window.toggleProdStatus = async (id, status) => updateDoc(doc(db, "products", id), { active: status });
        window.deleteProd = async (id) => confirm("Delete product?") && deleteDoc(doc(db, "products", id));
    </script>
</body>
</html>
