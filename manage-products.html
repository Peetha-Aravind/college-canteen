<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - SRKR Canteen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #fafafa; }
        .card-shadow { box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="text-gray-800 min-h-screen">
    
    <nav class="border-b border-gray-200 px-6 py-4 flex justify-between items-center bg-white shadow-sm sticky top-0 z-10">
        <div class="flex items-center space-x-4">
            <a href="manage-categories.html" class="text-sm font-bold text-gray-500 hover:text-gray-900 transition-colors">← Back to Categories</a>
        </div>
        <span class="text-xl font-bold tracking-tight text-gray-900">SRKR Canteen</span>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8">
        <div class="flex justify-between items-center mb-8 border-b border-gray-200 pb-4">
            <h2 id="page-title" class="text-2xl font-bold text-gray-900">Products</h2>
            <a id="add-product-btn" href="#" class="bg-gray-900 hover:bg-black text-white font-medium py-2.5 px-5 rounded-lg shadow-sm transition-colors">
                Add New Product
            </a>
        </div>
        
        <div id="products-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzj2KBA8wBb1rOhA80FnZzXkMKCTlp_Es",
            authDomain: "srkr-canteen.firebaseapp.com",
            projectId: "srkr-canteen",
            storageBucket: "srkr-canteen.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const categoryId = urlParams.get('categoryId');
        const categoryName = urlParams.get('categoryName');

        document.getElementById('page-title').innerText = `${categoryName || 'Category'} - Products`;
        document.getElementById('add-product-btn').href = `product.html?categoryId=${categoryId}`;

        const q = query(collection(db, "products"), where("categoryId", "==", categoryId));

        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                const isChecked = data.active !== false ? 'checked' : '';
                
                const typesHtml = data.types ? data.types.split(',').map(t => `<span class="bg-gray-100 text-gray-700 text-xs font-semibold px-2 py-1 rounded-md">${t.trim()}</span>`).join(' ') : '';

                container.innerHTML += `
                    <div class="bg-white border border-gray-100 rounded-2xl overflow-hidden flex flex-col card-shadow">
                        <img src="${data.image}" alt="${data.name}" class="w-full h-40 object-cover bg-gray-50 border-b border-gray-50">
                        <div class="p-5 flex flex-col flex-1">
                            <h3 class="font-bold text-lg text-gray-900 mb-1">${data.name}</h3>
                            <p class="text-sm text-gray-500 mb-3 line-clamp-2">${data.description}</p>
                            
                            <div class="flex flex-wrap gap-1 mb-4">
                                ${typesHtml}
                            </div>
                            
                            <div class="flex items-center justify-between mb-5 mt-auto bg-gray-50 p-3 rounded-lg">
                                <span class="text-sm font-semibold text-gray-600">Available</span>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" ${isChecked} onchange="window.toggleProdStatus('${id}', this.checked)" class="sr-only peer">
                                    <div class="w-10 h-5 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-green-500"></div>
                                </label>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-3 border-t border-gray-100 pt-4">
                                <a href="product.html?categoryId=${categoryId}&productId=${id}" class="bg-gray-50 text-center py-2 rounded-xl text-sm font-semibold text-gray-800 border border-gray-200 hover:bg-gray-100 transition-colors">Edit</a>
                                <button onclick="window.deleteProd('${id}')" class="bg-white border border-red-200 text-red-600 py-2 rounded-xl text-sm font-semibold hover:bg-red-50 transition-colors">Delete</button>
                            </div>
                        </div>
                    </div>`;
            });
        });

        window.toggleProdStatus = async (id, status) => updateDoc(doc(db, "products", id), { active: status });
        window.deleteProd = async (id) => confirm("Are you sure you want to delete this product?") && deleteDoc(doc(db, "products", id));
    </script>
</body>
</html>
